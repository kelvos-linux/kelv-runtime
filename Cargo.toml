[package]
name = "user-init"
version = "0.1.0"
edition = "2021"

[dependencies]
kelvos-rs = { path = "../kelvos-rs" }
kelvos-shared-ring = { path = "../shared-ring" }

[[bin]]
name = "user_init"
path = "src/main.rs"

[[bin]]
name = "user_child"
path = "src/child.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
